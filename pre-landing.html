
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QuantiQ | Hoja de ruta</title>

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Page styles -->
  <style>
    /* =========================================================
       1. THEME TOKENS AND GLOBAL STYLES
    ========================================================= */

    :root {
      --a: #F67F1C;
      --bg: #FBFBFA;
      --card: #fff;
      --ink: #3E2119;
      --mu: #7B6B64;
      --cr: #F5E6DB;
      --rn: #ECC9B2;
      --te: #CDA992;
      --tb: rgba(251, 251, 250, .95);
      --gb: #3E2119;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #2A1610;
        --card: #3E2119;
        --ink: #F5E6DB;
        --mu: #CDB7AA;
        --cr: #4A2C22;
        --rn: #5A3A2E;
        --tb: rgba(42, 22, 16, .95);
        --gb: #1D0E09;
      }
    }

    :root[data-theme="dark"] {
      --bg: #2A1610;
      --card: #3E2119;
      --ink: #F5E6DB;
      --mu: #CDB7AA;
      --cr: #4A2C22;
      --rn: #5A3A2E;
      --tb: rgba(42, 22, 16, .95);
      --gb: #1D0E09;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
    }

    html {
      scroll-padding-top: 90px;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    button,
    a {
      font-family: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--a);
      outline-offset: 2px;
    }


    /* =========================================================
       2. NAVIGATION
    ========================================================= */

    .top {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--tb);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--rn);
      padding: calc(env(safe-area-inset-top, 0px) + 6px) 16px 6px;
    }

    .ti {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .fl {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .82rem;
      font-weight: 700;
      flex-wrap: wrap;
    }

    .fl a,
    .fl span.s {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      padding: 0 6px;
      color: var(--mu);
      text-decoration: none;
    }

    .fl i {
      font-style: normal;
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--rn);
      color: var(--ink);
      font-size: .78rem;
    }

    .fl .on {
      color: var(--ink);
    }

    .fl .on i {
      background: var(--a);
      color: #3E2119;
    }

    .fl .ar {
      color: var(--te);
    }

    .rt {
      display: flex;
      gap: 8px;
      align-items: center;
      flex: none;
    }

    .lang {
      display: flex;
      border: 1px solid var(--te);
      border-radius: 99px;
      overflow: hidden;
    }

    .lang button {
      border: 0;
      background: none;
      color: var(--ink);
      font-weight: 700;
      font-size: .8rem;
      padding: 0 12px;
      min-height: 44px;
      cursor: pointer;
    }

    .lang button[aria-pressed="true"] {
      background: var(--a);
      color: #3E2119;
    }

    .tg {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--te);
      background: none;
      color: var(--ink);
      font-size: 1.15rem;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      .fl .ar {
        display: none;
      }

      .fl a,
      .fl span.s {
        padding: 0 3px;
      }
    }


    /* =========================================================
       3. PAGE LAYOUT AND HERO SECTION
    ========================================================= */

    .w {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .hero {
      padding: 48px 0 24px;
      text-align: center;
    }

    .tag {
      font-weight: 800;
      letter-spacing: .14em;
      font-size: .78rem;
      color: var(--mu);
      margin: 0;
    }

    h1 {
      font-size: clamp(2.1rem, 7vw, 3.6rem);
      line-height: 1.05;
      letter-spacing: -.04em;
      font-weight: 800;
      margin: 12px auto 14px;
      max-width: 20ch;
    }

    h1 em {
      font-style: normal;
      color: var(--a);
    }

    .lead {
      color: var(--mu);
      font-size: 1.08rem;
      max-width: 56ch;
      margin: 0 auto 20px;
    }

    .sum {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 0 0 22px;
    }

    .sum span {
      background: var(--cr);
      border-radius: 99px;
      padding: 5px 14px;
      font-weight: 700;
      font-size: .86rem;
    }

    .aud {
      display: inline-flex;
      background: var(--cr);
      border-radius: 99px;
      padding: 4px;
    }

    .aud button {
      border: 0;
      background: none;
      color: var(--ink);
      font-weight: 800;
      font-size: .9rem;
      padding: 0 20px;
      min-height: 44px;
      border-radius: 99px;
      cursor: pointer;
    }

    .aud button[aria-pressed="true"] {
      background: var(--a);
      color: #3E2119;
    }


    /* =========================================================
       4. ROADMAP CARDS AND BUILDING DESIGN
    ========================================================= */

    .map {
      list-style: none;
      margin: 40px 0 0;
      padding: 0 0 8px;
      position: relative;
    }

    .map::before,
    .fill {
      content: "";
      position: absolute;
      left: 23px;
      width: 4px;
      border-radius: 4px;
      top: 0;
    }

    .map::before {
      bottom: 0;
      background: repeating-linear-gradient(
        var(--te) 0 8px,
        transparent 8px 16px
      );
    }

    .fill {
      background: var(--a);
      height: 0;
      transition: height .6s;
      z-index: 1;
    }

    .map li {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 16px;
      margin-bottom: 22px;
      position: relative;
    }

    .map li.done {
      margin-top: 56px;
    }

    .node {
      grid-column: 1;
      grid-row: 1;
      z-index: 2;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      background: var(--card);
      border: 3px dashed var(--te);
      color: var(--mu);
    }

    .done .node {
      background: var(--a);
      border: 3px solid var(--a);
      color: #3E2119;
    }

    .cur .node {
      background: var(--ink);
      border: 3px solid var(--ink);
      color: var(--bg);
      animation: pu 2s infinite;
    }

    @keyframes pu {
      0% {
        box-shadow: 0 0 0 0 rgba(246, 127, 28, .6);
      }

      70%,
      100% {
        box-shadow: 0 0 0 14px rgba(246, 127, 28, 0);
      }
    }

    .card {
      position: relative;
      grid-column: 2;
      grid-row: 1;
      background: var(--card);
      border: 1px solid var(--rn);
      border-radius: 20px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, .08);
    }

    .cur .card {
      border: 2px solid var(--a);
    }

    .hd {
      all: unset;
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 18px 20px;
      cursor: pointer;
      border-radius: 20px;
    }

    .hd:focus-visible {
      outline: 3px solid var(--a);
      outline-offset: 2px;
    }

    .st {
      display: inline-block;
      font-weight: 800;
      font-size: .7rem;
      letter-spacing: .07em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 99px;
      background: var(--cr);
      color: var(--mu);
    }

    .done .st {
      background: var(--a);
      color: #3E2119;
    }

    .cur .st {
      background: var(--ink);
      color: var(--bg);
    }

    .here {
      font-size: .72rem;
      font-weight: 800;
      color: var(--a);
      margin-left: 8px;
      letter-spacing: .05em;
    }

    .dn {
      display: block;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .1em;
      color: var(--mu);
      margin: 10px 0 0;
    }

    .tt {
      display: block;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.2;
      margin: 2px 0 6px;
    }

    .ds {
      display: block;
      color: var(--mu);
      font-size: .97rem;
    }

    .pl {
      float: right;
      font-weight: 800;
      color: var(--a);
      font-size: 1.4rem;
      line-height: 1;
    }

    .dt {
      padding: 0 20px 18px;
    }

    .dt div {
      background: var(--cr);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: .95rem;
    }

    .dt b {
      display: block;
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--mu);
    }

    .dt[hidden] {
      display: none;
    }


    /* =========================================================
       5. ROBOT ILLUSTRATION AND ANIMATIONS
    ========================================================= */

    .bot {
      position: absolute;
      top: -58px;
      right: 20px;
      width: 64px;
      height: 64px;
      pointer-events: none;
    }

    .arm {
      transform-origin: 40px 38px;
      animation: dig 1.1s ease-in-out infinite;
    }

    @keyframes dig {
      0%,
      100% {
        transform: rotate(-8deg);
      }

      50% {
        transform: rotate(14deg);
      }
    }

    .pa {
      animation: pop 1.1s ease-out infinite;
      opacity: 0;
    }

    .pb {
      --dx: -5px;
      animation-delay: .05s;
    }

    .pa {
      --dx: 6px;
    }

    @keyframes pop {
      0%,
      48% {
        opacity: 0;
        transform: translate(0, 0);
      }

      55% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translate(var(--dx), -13px);
      }
    }


    /* =========================================================
       6. CALL TO ACTION AND FOOTER
    ========================================================= */

    .go {
      margin: 44px 0 0;
      background: var(--gb);
      color: #F5E6DB;
      border-radius: 28px;
      text-align: center;
      padding: 44px 24px;
    }

    .go h2 {
      font-size: 1.7rem;
      letter-spacing: -.03em;
      margin: 0 0 8px;
    }

    .go p {
      margin: 0 auto 22px;
      max-width: 50ch;
      opacity: .85;
    }

    .btn {
      display: inline-block;
      padding: 15px 28px;
      border-radius: 12px;
      font-weight: 800;
      text-decoration: none;
      background: var(--a);
      color: #3E2119;
      border: 2px solid var(--a);
      margin: 0 6px 8px;
    }

    .btn.o {
      background: none;
      color: #F5E6DB;
      border-color: #F5E6DB;
    }

    .btn:hover {
      filter: brightness(1.07);
    }

    footer {
      text-align: center;
      color: var(--mu);
      font-size: .85rem;
      padding: 28px 0 36px;
    }


    /* =========================================================
       7. DEMO NOTICE AND EDITING CONTROLS
    ========================================================= */

    .demo {
      display: inline-block;
      max-width: 58ch;
      margin: 0 auto 20px;
      padding: 10px 16px;
      border: 2px dashed var(--a);
      border-radius: 14px;
      background: var(--cr);
      font-size: .95rem;
      text-align: left;
    }

    .demo b {
      background: var(--a);
      color: #3E2119;
      border-radius: 99px;
      padding: 2px 10px;
      font-size: .72rem;
      letter-spacing: .08em;
      margin-right: 8px;
    }

    .tg[aria-pressed="true"] {
      background: var(--a);
      border-color: var(--a);
      color: #3E2119;
    }

    .epn {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
      margin: 20px auto 0;
      font-size: .9rem;
      color: var(--mu);
      max-width: 640px;
    }

    .epn[hidden] {
      display: none;
    }

    .epn button,
    .eb {
      border: 2px solid var(--te);
      background: none;
      color: var(--ink);
      border-radius: 10px;
      font-weight: 800;
      padding: 0 14px;
      min-height: 44px;
      cursor: pointer;
    }

    .eb {
      margin: 0 20px 16px;
      border-color: var(--a);
    }

    .ef .eb {
      margin: 0;
    }

    .eb.sv {
      background: var(--a);
      color: #3E2119;
    }

    .ef {
      padding: 0 20px 18px;
      display: grid;
      gap: 10px;
      text-align: left;
    }

    .ef label {
      font-size: .74rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--mu);
      display: grid;
      gap: 4px;
    }

    .ef input,
    .ef select,
    .ef textarea {
      font: 500 1rem "Plus Jakarta Sans", sans-serif;
      color: var(--ink);
      background: var(--bg);
      border: 2px solid var(--te);
      border-radius: 10px;
      padding: 10px 12px;
      min-height: 44px;
      width: 100%;
      text-transform: none;
      letter-spacing: 0;
    }

    .ef textarea {
      min-height: 84px;
      resize: vertical;
    }

    .ef .r {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .fill {
      top: auto;
      bottom: 0;
    }

    .tw {
      display: flex;
      justify-content: center;
      margin: 0 auto 18px;
    }

    .tw svg {
      max-width: 100%;
      height: auto;
    }

    .tw g:focus-visible {
      outline: 3px solid var(--a);
    }

    .bl {
      animation: bk 1.6s ease-in-out infinite;
    }

    @keyframes bk {
      50% {
        opacity: .35;
      }
    }

    .done .card {
      box-shadow: 0 0 0 2px rgba(246, 127, 28, .35),
        0 10px 26px rgba(0, 0, 0, .08);
    }

    .next .card {
      border-style: dashed;
      background-image: repeating-linear-gradient(
        135deg,
        transparent 0 14px,
        rgba(205, 169, 146, .14) 14px 28px
      );
    }

    .street {
      margin: 6px 0 0;
      background: var(--te);
      color: #3E2119;
      border-radius: 12px;
      text-align: center;
      font-weight: 800;
      letter-spacing: .16em;
      font-size: .8rem;
      padding: 12px;
    }

    @media (prefers-reduced-motion: reduce) {
      .bl {
        animation: none;
      }
    }

    .gb {
      background: var(--a);
      color: #3E2119;
      border: 0;
      border-radius: 99px;
      font-weight: 800;
      font-size: .9rem;
      padding: 0 18px;
      min-height: 44px;
      cursor: pointer;
    }

    .gb:hover {
      filter: brightness(1.07);
    }

    .map::before,
    .fill {
      display: none;
    }

    .bld {
      position: relative;
      max-width: 760px;
      margin: 40px auto 0;
      padding-top: 50px;
    }

    .bld::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 4px;
      height: 34px;
      transform: translateX(-50%);
      background: var(--te);
      border-radius: 3px;
    }

    .bld::after {
      content: "";
      position: absolute;
      top: 28px;
      left: 50%;
      width: 46%;
      height: 30px;
      transform: translateX(-50%);
      background: #3E2119;
      border: 3px solid var(--te);
      border-bottom: 0;
      border-radius: 12px 12px 0 0;
    }

    .map {
      margin: 0;
      padding: 6px 14px 0;
      position: relative;
      z-index: 1;
      border: 3px solid var(--te);
      border-radius: 10px 10px 0 0;
      background: linear-gradient(
        90deg,
        rgba(205, 169, 146, .2) 0 8px,
        transparent 8px calc(100% - 8px),
        rgba(205, 169, 146, .2) calc(100% - 8px)
      ) #3E2119;
    }

    .map li {
      grid-template-columns: 44px 1fr;
      gap: 12px;
      margin: 0;
      padding: 24px 0 22px;
      border-bottom: 5px solid var(--te);
    }

    .map li.done {
      margin-top: 0;
      padding-top: 52px;
    }

    .map li:last-child {
      border-bottom: 0;
    }

    .node {
      width: 44px;
      height: 44px;
      background: transparent;
      border: 3px dashed var(--te);
      color: #F5E6DB;
    }

    .done .node {
      background: var(--a);
      border: 3px solid var(--a);
      color: #3E2119;
    }

    .cur .node {
      background: #F5E6DB;
      border: 3px solid #F5E6DB;
      color: #3E2119;
    }

    .card {
      border: 6px solid var(--te);
      border-radius: 14px 14px 4px 4px;
    }

    .done .card {
      border-color: var(--a);
      box-shadow: 0 0 24px rgba(246, 127, 28, .55);
    }

    .cur .card {
      border: 6px solid #F5E6DB;
      box-shadow: 0 0 20px rgba(245, 230, 219, .45);
    }

    .next .card {
      border: 6px solid #7B6B64;
      background-color: #5A3A2E;
      color: #F5E6DB;
      box-shadow: none;
    }

    .next .ds,
    .next .dn,
    .next .dt b,
    .next .ef label {
      color: #CDB7AA;
    }

    .next .dt div {
      background: #3E2119;
    }

    .next .st {
      background: #7B6B64;
      color: #FBFBFA;
    }

    .bot {
      top: -40px;
      right: 12px;
      width: 52px;
      height: 52px;
    }

    .done .hd {
      padding-right: 72px;
    }

    .bld .street {
      position: relative;
      z-index: 1;
      margin: 0;
      border-radius: 0 0 12px 12px;
    }

    @media (max-width: 480px) {
      .map {
        padding: 6px 10px 0;
      }

      .map li {
        gap: 8px;
        grid-template-columns: 40px 1fr;
      }

      .node {
        width: 40px;
        height: 40px;
      }

      .gb {
        padding: 0 12px;
        font-size: .82rem;
      }
    }

    .bld {
      padding-top: 0;
    }

    .bld::before,
    .bld::after {
      display: none;
    }

    .crown {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .crown i {
      display: block;
      background: #3E2119;
      border: 3px solid var(--te);
      border-bottom: 0;
    }

    .crown .m {
      position: relative;
      width: 5px;
      height: 84px;
      border: 0;
      border-radius: 3px 3px 0 0;
      background: var(--te);
    }

    .crown .m::after {
      content: "";
      position: absolute;
      top: -4px;
      left: 50%;
      width: 11px;
      height: 11px;
      margin-left: -5.5px;
      border-radius: 50%;
      background: #E5322D;
      box-shadow: 0 0 12px 4px rgba(229, 50, 45, .75);
      animation: bc 1.2s steps(1, end) infinite;
    }

    @keyframes bc {
      0% {
        opacity: 1;
      }

      50% {
        opacity: .08;
        box-shadow: none;
      }
    }

    .crown .t3 {
      width: 8%;
      height: 28px;
      border-radius: 6px 6px 0 0;
    }

    .crown .t2 {
      width: 16%;
      height: 30px;
      border-radius: 8px 8px 0 0;
    }

    .crown .t1 {
      width: 30%;
      height: 34px;
      border-radius: 10px 10px 0 0;
    }

    .map {
      border: 0;
      background: none;
      padding: 0;
      border-radius: 0;
    }

    .map li {
      background-color: #3E2119;
      background-image: linear-gradient(
        90deg,
        rgba(205, 169, 146, .2) 0 8px,
        transparent 8px calc(100% - 8px),
        rgba(205, 169, 146, .2) calc(100% - 8px)
      );
      border-left: 3px solid var(--te);
      border-right: 3px solid var(--te);
      padding-left: 14px;
      padding-right: 14px;
      margin: 0 auto;
    }

    .f1,
    .f2 {
      width: 100%;
    }

    .f3 {
      width: 92%;
    }

    .f4 {
      width: 84%;
    }

    .f5 {
      width: 76%;
    }

    .f6 {
      width: 68%;
      border-top: 3px solid var(--te);
    }

    .map li.cur {
      animation: fl 1.8s ease-in-out infinite;
    }

    .cur .card {
      animation: fc 1.8s ease-in-out infinite;
    }

    @keyframes fl {
      0%,
      100% {
        background-color: #6B3F2A;
      }

      50% {
        background-color: #3E2119;
      }
    }

    @keyframes fc {
      0%,
      100% {

          "(prefers-reduced-motion: reduce)"
        ).matches;

        firstFloorButton.scrollIntoView({
          behavior: reduceMotion ? "auto" : "smooth",
          block: "center"
        });

        firstFloorButton.focus({ preventScroll: true });
      }
    };


    /* Toggle editing mode */
    $("ed").onclick = function () {
      EM = !EM;

      if (!EM) {
        ED = -1;
      }

      paint();
    };


    /* Editing toolbar actions */
    $("epn").addEventListener("click", function (event) {
      var button = event.target.closest("button");

      if (!button) {
        return;
      }

      if (button.id === "rs") {
        try {
          localStorage.removeItem("qq_rm");
        } catch (error) {
          // Continue by restoring the default roadmap in memory.
        }

        D = JSON.parse(DEFAULT_ROADMAP);
        ED = -1;

        paint();
      } else if (button.id === "ad") {
        addFloor();
      } else if (button.id === "cp") {
        try {
          navigator.clipboard.writeText(
            JSON.stringify(D, null, 1)
          ).then(function () {
            button.textContent = T[L].cpd;
          });
        } catch (error) {
          // Clipboard access may be unavailable outside a secure context.
        }
      }
    });


    /* Language selector */
    $("es").onclick = function () {
      L = "es";
      saveLanguage();
      paint();
    };

    $("en").onclick = function () {
      L = "en";
      saveLanguage();
      paint();
    };


    /* Theme selector */
    $("tg").onclick = function () {
      var nextTheme = isDarkMode() ? "light" : "dark";

      document.documentElement.setAttribute(
        "data-theme",
        nextTheme
      );

      try {
        localStorage.setItem("tema", nextTheme);
      } catch (error) {
        // Theme selection remains active for the current page session.
      }

      updateThemeButton();
    };


    /* System theme preference */
    var colorScheme = window.matchMedia(
      "(prefers-color-scheme: dark)"
    );

    if (colorScheme.addEventListener) {
      colorScheme.addEventListener(
        "change",
        updateThemeButton
      );
    }

    window.addEventListener("resize", fill);


    /* ---------------------------------------------------------
       9.9. INITIAL PAGE RENDER
    --------------------------------------------------------- */

    paint();
    window.setTimeout(fill, 300);
  </script>
</body>
</html>
