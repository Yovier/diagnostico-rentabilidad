  <!-- Interactive, read-only roadmap behavior -->
  <script>

  /* ---------------------------------------------------------

      en: [

    },
    {
      k: "done",

        "Encuentra tus fugas de dinero.",

    },

    {

      ],

    },
    {
      k: "next",
      es: [
        "Conoce tu inteligencia financiera.",
        "Todo conectado, siempre al día.",
        "Tu historial, alertas y guía continua, conectados a tus herramientas contables.",
        "Visión de escala: integraciones, alianzas y expansión regional."
      ],
      en: [
        "Meet your financial intelligence.",
        "Everything connected, always up to date.",
        "Your history, alerts and ongoing guidance, connected to your accounting tools.",
        "Scale vision: integrations, partnerships and regional expansion."
      ]
    }
  ];

  /* ---------------------------------------------------------
     3. State and storage
  --------------------------------------------------------- */
  var L = "es";
  var A = "c";
  var open = { 2: 1 };
  var $ = function (id) {
    return document.getElementById(id);
  };

  try {
    var savedLanguage = localStorage.getItem("lang");

    if (savedLanguage) {
      L = savedLanguage;
    } else if ((navigator.language || "").slice(0, 2) === "en") {
      L = "en";
    }
  } catch (error) {
    // Keep Spanish as the default language when storage is unavailable.
  }

  /* ---------------------------------------------------------
     4. Display utilities
  --------------------------------------------------------- */
  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/"/g, "&quot;");
  }

  /* ---------------------------------------------------------
     5. Robot illustration
  --------------------------------------------------------- */
  var BOT = `
    <svg class="bot" viewBox="0 0 64 64" aria-hidden="true">
      <ellipse cx="32" cy="60" rx="27" ry="4" fill="#CDA992" />
      <rect x="46" y="51" width="14" height="9" rx="2" fill="#7B6B64" />
      <path d="M50 51v-2h6v2" stroke="#3E2119" fill="none" stroke-width="1.5" />
      <rect x="24" y="50" width="6" height="9" rx="3" fill="#3E2119" />
      <rect x="34" y="50" width="6" height="9" rx="3" fill="#3E2119" />
      <rect x="22" y="34" width="20" height="19" rx="6" fill="#CDA992" />
      <path d="M30 36h4l1 4-3 9-3-9z" fill="#3E2119" />
      <line x1="32" y1="9" x2="32" y2="15" stroke="#3E2119" stroke-width="2" />
      <circle cx="32" cy="7" r="3" fill="#F67F1C" />
      <rect x="17" y="14" width="30" height="23" rx="11" fill="#F67F1C" />
      <rect x="21" y="18" width="22" height="14" rx="7" fill="#FBFBFA" />
      <circle cx="28" cy="24" r="2.4" fill="#3E2119" />
      <circle cx="36" cy="24" r="2.4" fill="#3E2119" />
      <path d="M29 28Q32 30.6 35 28" stroke="#3E2119" fill="none" stroke-width="1.4" stroke-linecap="round" />
      <circle cx="24" cy="28" r="1.6" fill="#ECC9B2" />
      <circle cx="40" cy="28" r="1.6" fill="#ECC9B2" />
      <g class="arm">
        <rect x="38" y="36" width="10" height="5" rx="2.5" fill="#CDA992" />
        <line x1="46" y1="38" x2="54" y2="30" stroke="#7B6B64" stroke-width="2.6" stroke-linecap="round" />
        <circle cx="57" cy="26" r="5" fill="rgba(251,251,250,.6)" stroke="#3E2119" stroke-width="2" />
      </g>
      <circle class="pa" cx="58" cy="17" r="1.8" fill="#F67F1C" />
      <circle class="pa pb" cx="52" cy="19" r="1.4" fill="#ECC9B2" />
    </svg>
  `;

  /* ---------------------------------------------------------
     6. Language, theme and roadmap rendering
  --------------------------------------------------------- */
  function fill() {
    var nodes = document.querySelectorAll(".done .node, .cur .node");
    var currentNode = nodes[0];
    var roadmap = $("map");

    if (currentNode) {
      $("fill").style.height =
        roadmap.getBoundingClientRect().bottom -
        currentNode.getBoundingClientRect().top -
        24 + "px";
    }
  }

  function paint() {
    var labels = T[L];
    document.documentElement.lang = L;

    $("es").setAttribute("aria-pressed", L === "es");
    $("en").setAttribute("aria-pressed", L === "en");

    $("h1").innerHTML = labels.h1;
    $("go0").textContent = labels.g0;
    $("go0").setAttribute("aria-label", labels.g0a);
    $("stt").textContent = labels.str;
    $("demo").innerHTML = labels.demo;
    $("ld").textContent = labels.ld;
    $("gh").textContent = labels.gh;
    $("gp").textContent = labels.gp;
    $("g1").textContent = labels.g1;
    $("heroStart").textContent = labels.g1;
    $("g2").textContent = labels.g2;
    $("ft").textContent = labels.ft;

    var fillElement = $("fill");

    $("map").innerHTML = D.map(function (floor, index) {
      return [floor, index];
    })
      .reverse()
      .map(function (item) {
        var floor = item[0];
        var index = item[1];
        var text = floor[L];
        var isOpen = open[index];
        var width = Math.max(52, 100 - 8 * Math.max(0, index - 1));
        var mobileWidth = Math.max(80, 100 - 3 * Math.max(0, index - 1));
        var nodeLabel = floor.k === "done" ? "✓" : index + 1;
        var currentMarker = floor.k === "cur"
          ? `<span class="here">${labels.here}</span>`
          : "";

        return `
          <li class="${floor.k}" style="--w:${width}; --m:${mobileWidth};">
            <div class="node" aria-hidden="true">${nodeLabel}</div>

            <div class="card">
              ${floor.k === "done" ? BOT : ""}

              <button
                class="hd"
                data-i="${index}"
                aria-expanded="${!!isOpen}"
              >
                <span class="pl" aria-hidden="true">${isOpen ? "−" : "+"}</span>
                <span class="st">${labels[floor.k]}</span>
                ${currentMarker}
                <span class="dn">${labels.d} · ${labels.fl} 0${index + 1}</span>
                <span class="tt">${escapeHtml(text[0])}</span>
                <span class="ds">${escapeHtml(text[1])}</span>
              </button>

              <div class="dt"${isOpen ? "" : " hidden"}>
                <div>
                  <b>${labels.lab[A]}</b>
                  ${escapeHtml(A === "c" ? text[2] : text[3])}
                </div>
              </div>

            </div>
          </li>
        `;
      })
      .join("");

    $("map").insertBefore(fillElement, $("map").firstChild);
    fill();
    updateThemeButton();
  }

  function isDarkMode() {
    var theme = document.documentElement.getAttribute("data-theme");
    var darkPreference = window.matchMedia("(prefers-color-scheme: dark)");

    return theme ? theme === "dark" : darkPreference.matches;
  }

  function updateThemeButton() {
    var button = $("tg");
    var dark = isDarkMode();

    button.textContent = dark ? "\u2600" : "\u263e";
    button.setAttribute(
      "aria-label",
      L === "en"
        ? (dark ? "Switch to day mode" : "Switch to night mode")
        : (dark ? "Cambiar a modo día" : "Cambiar a modo noche")
    );
  }

  function saveLanguage() {
    try {
      localStorage.setItem("lang", L);
    } catch (error) {
      // Language selection remains active for the current page session.
    }
  }

  /* ---------------------------------------------------------
     7. Event listeners
  --------------------------------------------------------- */
  $("map").addEventListener("click", function (event) {
    var floorButton = event.target.closest(".hd");

    if (!floorButton) {
      return;
    }

    var floorIndex = floorButton.dataset.i;
    open[floorIndex] = open[floorIndex] ? 0 : 1;
    paint();

    var updatedButton = document.querySelector(
      `.hd[data-i="${floorIndex}"]`
    );

    if (updatedButton) {
      updatedButton.focus();
    }
  });

  $("go0").onclick = function () {
    open[0] = 1;
    paint();

    var firstFloorButton = document.querySelector('.hd[data-i="0"]');
    if (firstFloorButton) {
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      firstFloorButton.scrollIntoView({
        behavior: reduceMotion ? "auto" : "smooth",
        block: "center"
      });
      firstFloorButton.focus({ preventScroll: true });
    }
  };

  $("es").onclick = function () {
    L = "es";
    saveLanguage();
    paint();
  };

  $("en").onclick = function () {
    L = "en";
    saveLanguage();
    paint();
  };

  $("tg").onclick = function () {
    var nextTheme = isDarkMode() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", nextTheme);

    try {
      localStorage.setItem("tema", nextTheme);
    } catch (error) {
      // Theme selection remains active for the current page session.
    }

    updateThemeButton();
  };

  var colorScheme = window.matchMedia("(prefers-color-scheme: dark)");
  if (colorScheme.addEventListener) {
    colorScheme.addEventListener("change", updateThemeButton);
  }

  window.addEventListener("resize", fill);

  /* ---------------------------------------------------------
     8. Initial page render
  --------------------------------------------------------- */
  paint();
  window.setTimeout(fill, 300);
</script>
