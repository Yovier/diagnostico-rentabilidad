
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>QuantiQ | Hoja de ruta</title>

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- =====================================================
       1. STYLES AND THEME CONFIGURATION
  ====================================================== -->

  <style>
    /* Theme variables */
    :root {
      --a: #F67F1C;
      --bg: #FBFBFA;
      --card: #fff;
      --ink: #3E2119;
      --mu: #7B6B64;
      --cr: #F5E6DB;
      --rn: #ECC9B2;
      --te: #CDA992;
      --tb: rgba(251, 251, 250, .95);
      --gb: #3E2119;
    }

    /* Automatic dark theme */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #2A1610;
        --card: #3E2119;
        --ink: #F5E6DB;
        --mu: #CDB7AA;
        --cr: #4A2C22;
        --rn: #5A3A2E;
        --tb: rgba(42, 22, 16, .95);
        --gb: #1D0E09;
      }
    }

    /* Manual dark theme */
    :root[data-theme="dark"] {
      --bg: #2A1610;
      --card: #3E2119;
      --ink: #F5E6DB;
      --mu: #CDB7AA;
      --cr: #4A2C22;
      --rn: #5A3A2E;
      --tb: rgba(42, 22, 16, .95);
      --gb: #1D0E09;
    }

    /* Global styles */
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
    }

    html {
      scroll-padding-top: 90px;
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    button,
    a {
      font-family: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--a);
      outline-offset: 2px;
    }


    /* =====================================================
       2. NAVIGATION
    ====================================================== */

    .top {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--tb);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--rn);
      padding: calc(env(safe-area-inset-top, 0px) + 6px) 16px 6px;
    }

    .ti {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .rt {
      display: flex;
      gap: 8px;
      align-items: center;
      flex: none;
    }

    /* Floor 1 button */
    .gb {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      min-height: 56px;
      padding: 0 24px;

      background: #F67F1C;
      color: #3E2119;

      border: 0;
      border-radius: 999px;

      font-family: inherit;
      font-size: 18px;
      font-weight: 800;

      cursor: pointer;

      transition: filter .2s ease, transform .2s ease;
    }

    .gb:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .gb:focus-visible {
      outline: 3px solid #CDA992;
      outline-offset: 3px;
    }

    /* Language selector */
    .lang {
      display: flex;
      border: 1px solid var(--te);
      border-radius: 99px;
      overflow: hidden;
    }

    .lang button {
      border: 0;
      background: none;
      color: var(--ink);
      font-weight: 700;
      font-size: .8rem;
      padding: 0 12px;
      min-height: 44px;
      cursor: pointer;
    }

    .lang button[aria-pressed="true"] {
      background: var(--a);
      color: #3E2119;
    }

    /* Theme button */
    .tg {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--te);
      background: none;
      color: var(--ink);
      font-size: 1.15rem;
      cursor: pointer;
    }

    .tg[aria-pressed="true"] {
      background: var(--a);
      border-color: var(--a);
      color: #3E2119;
    }


    /* =====================================================
       3. MAIN LAYOUT AND HERO
    ====================================================== */

    .w {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .hero {
      padding: 48px 0 24px;
      text-align: center;
    }

    .tag {
      font-weight: 800;
      letter-spacing: .14em;
      font-size: .78rem;
      color: var(--mu);
      margin: 0;
    }

    h1 {
      font-size: clamp(2.1rem, 7vw, 3.6rem);
      line-height: 1.05;
      letter-spacing: -.04em;
      font-weight: 800;
      margin: 12px auto 14px;
      max-width: 20ch;
    }

    h1 em {
      font-style: normal;
      color: var(--a);
    }

    .lead {
      color: var(--mu);
      font-size: 1.08rem;
      max-width: 56ch;
      margin: 0 auto 20px;
    }

    /* Demo notice */
    .demo {
      display: inline-block;
      max-width: 58ch;
      margin: 0 auto 20px;
      padding: 10px 16px;
      border: 2px dashed var(--a);
      border-radius: 14px;
      background: var(--cr);
      font-size: .95rem;
      text-align: left;
    }

    .demo b {
      background: var(--a);
      color: #3E2119;
      border-radius: 99px;
      padding: 2px 10px;
      font-size: .72rem;
      letter-spacing: .08em;
      margin-right: 8px;
    }

    /* Audience selector */
    .aud {
      display: inline-flex;
      background: var(--cr);
      border-radius: 99px;
      padding: 4px;
    }

    .aud button {
      border: 0;
      background: none;
      color: var(--ink);
      font-weight: 800;
      font-size: .9rem;
      padding: 0 20px;
      min-height: 44px;
      border-radius: 99px;
      cursor: pointer;
    }

    .aud button[aria-pressed="true"] {
      background: var(--a);
      color: #3E2119;
    }


    /* =====================================================
       4. BUILDING AND ROADMAP
    ====================================================== */

    .bld {
      position: relative;
      max-width: 760px;
      margin: 40px auto 0;
    }

    /* Building roof */
    .crown {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .crown i {
      display: block;
      background: #3E2119;
      border: 3px solid var(--te);
      border-bottom: 0;
    }

    .crown .m {
      position: relative;
      width: 5px;
      height: 84px;
      border: 0;
      border-radius: 3px 3px 0 0;
      background: var(--te);
    }

    .crown .m::after {
      content: "";
      position: absolute;
      top: -4px;
      left: 50%;
      width: 11px;
      height: 11px;
      margin-left: -5.5px;
      border-radius: 50%;
      background: #E5322D;
      box-shadow: 0 0 12px 4px rgba(229, 50, 45, .75);
      animation: bc 1.2s steps(1, end) infinite;
    }

    .crown .t3 {
      width: 8%;
      height: 28px;
      border-radius: 6px 6px 0 0;
    }

    .crown .t2 {
      width: 16%;
      height: 30px;
      border-radius: 8px 8px 0 0;
    }

    .crown .t1 {
      width: 30%;
      height: 34px;
      border-radius: 10px 10px 0 0;
    }

    @keyframes bc {
      0% {
        opacity: 1;
      }

      50% {
        opacity: .08;
        box-shadow: none;
      }
    }

    /* Roadmap list */
    .map {
      list-style: none;
      margin: 0;
      padding: 0;
      position: relative;
      border: 0;
      background: none;
    }

    .map li {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 12px;
      width: calc(var(--w, 100) * 1%);
      margin: 0 auto;
      padding: 24px 14px 22px;
      position: relative;

      background-color: #3E2119;
      background-image: linear-gradient(
        90deg,
        rgba(205, 169, 146, .2) 0 8px,
        transparent 8px calc(100% - 8px),
        rgba(205, 169, 146, .2) calc(100% - 8px)
      );

      border-left: 3px solid var(--te);
      border-right: 3px solid var(--te);
      border-bottom: 5px solid var(--te);
    }

    .map li:first-of-type {
      border-top: 3px solid var(--te);
    }

    .map li:last-child {
      border-bottom: 0;
    }

    .map li.done {
      padding-top: 52px;
    }

    /* Current roadmap floor animation */
    .map li.cur {
      animation: fl 1.8s ease-in-out infinite;
    }

    @keyframes fl {
      0%,
      100% {
        background-color: #6B3F2A;
      }

      50% {
        background-color: #3E2119;
      }
    }

    /* Floor indicators */
    .node {
      grid-column: 1;
      grid-row: 1;
      z-index: 2;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      background: transparent;
      border: 3px dashed var(--te);
      color: #F5E6DB;
    }

    .done .node {
      background: var(--a);
      border: 3px solid var(--a);
      color: #3E2119;
    }

    .cur .node {
      background: #F5E6DB;
      border: 3px solid #F5E6DB;
      color: #3E2119;
    }

    /* Roadmap cards */
    .card {
      position: relative;
      grid-column: 2;
      grid-row: 1;
      border: 6px solid var(--te);
      border-radius: 14px 14px 4px 4px;
    }

    .done .card {
      border-color: var(--a);
      box-shadow: 0 0 24px rgba(246, 127, 28, .55);
    }

    .cur .card {
      border: 6px solid #F5E6DB;
      box-shadow: 0 0 20px rgba(245, 230, 219, .45);
      animation: fc 1.8s ease-in-out infinite;
    }

    @keyframes fc {
      0%,
      100% {
        border-color: #F5E6DB;
        box-shadow: 0 0 26px rgba(245, 230, 219, .65);
      }

      50% {
        border-color: #7B6B64;
        box-shadow: none;
      }
    }

    .next .card {
      border: 6px solid #7B6B64;
      background-color: #5A3A2E;
      color: #F5E6DB;
      box-shadow: none;
    }

    /* Clickable floor headings */
    .hd {
      all: unset;
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 18px 20px;
      cursor: pointer;
      border-radius: 20px;
    }

    .hd:focus-visible {
      outline: 3px solid var(--a);
      outline-offset: 2px;
    }

    .done .hd {
      padding-right: 72px;
    }

    /* Floor status */
    .st {
      display: inline-block;
      font-weight: 800;
      font-size: .7rem;
      letter-spacing: .07em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 99px;
      background: var(--cr);
      color: var(--mu);
    }

    .done .st {
      background: var(--a);
      color: #3E2119;
    }

    .cur .st {
      background: var(--ink);
      color: var(--bg);
    }

    .next .st {
      background: #7B6B64;
      color: #FBFBFA;
    }

    .here {
      font-size: .72rem;
      font-weight: 800;
      color: var(--a);
      margin-left: 8px;
      letter-spacing: .05em;
    }

    .dn {
      display: block;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .1em;
      color: var(--mu);
      margin: 10px 0 0;
    }

    .tt {
      display: block;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.2;
      margin: 2px 0 6px;
    }

    .ds {
      display: block;
      color: var(--mu);
      font-size: .97rem;
    }

    .next .ds,
    .next .dn {
      color: #CDB7AA;
    }

    .pl {
      float: right;
      font-weight: 800;
      color: var(--a);
      font-size: 1.4rem;
      line-height: 1;
    }

    /* Expanded floor details */
    .dt {
      padding: 0 20px 18px;
    }

    .dt div {
      background: var(--cr);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: .95rem;
    }

    .dt b {
      display: block;
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--mu);
    }

    .next .dt b {
      color: #CDB7AA;
    }

    .next .dt div {
      background: #3E2119;
    }

    .dt[hidden] {
      display: none;
    }


    /* =====================================================
       5. ROBOT ILLUSTRATION AND ANIMATIONS
    ====================================================== */

    .bot {
      position: absolute;
      top: -40px;
      right: 12px;
      width: 52px;
      height: 52px;
      pointer-events: none;
    }

    .arm {
      transform-origin: 40px 38px;
      animation: dig 1.1s ease-in-out infinite;
    }

    @keyframes dig {
      0%,
      100% {
        transform: rotate(-8deg);
      }

      50% {
        transform: rotate(14deg);
      }
    }

    .pa {
      --dx: 6px;
      animation: pop 1.1s ease-out infinite;
      opacity: 0;
    }

    .pb {
      --dx: -5px;
      animation-delay: .05s;
    }

    @keyframes pop {
      0%,
      48% {
        opacity: 0;
        transform: translate(0, 0);
      }

      55% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translate(var(--dx), -13px);
      }
    }


    /* =====================================================
       6. STREET, CALL TO ACTION AND FOOTER
    ====================================================== */

    .street {
      position: relative;
      z-index: 1;
      margin: 0;
      background: var(--te);
      color: #3E2119;
      border-radius: 0 0 12px 12px;
      text-align: center;
      font-weight: 800;
      letter-spacing: .16em;
      font-size: .8rem;
      padding: 12px;
    }

    .go {
      margin: 44px 0 0;
      background: var(--gb);
      color: #F5E6DB;
      border-radius: 28px;
      text-align: center;
      padding: 44px 24px;
    }

    .go h2 {
      font-size: 1.7rem;
      letter-spacing: -.03em;
      margin: 0 0 8px;
    }

    .go p {
      margin: 0 auto 22px;
      max-width: 50ch;
      opacity: .85;
    }

    .btn {
      display: inline-block;
      padding: 15px 28px;
      border-radius: 12px;
      font-weight: 800;
      text-decoration: none;
      background: var(--a);
      color: #3E2119;
      border: 2px solid var(--a);
      margin: 0 6px 8px;
    }

    .btn.o {
      background: none;
      color: #F5E6DB;
      border-color: #F5E6DB;
    }

    .btn:hover {
      filter: brightness(1.07);
    }

    footer {
      text-align: center;
      color: var(--mu);
      font-size: .85rem;
      padding: 28px 0 36px;
    }


    /* =====================================================
       7. RESPONSIVE DESIGN AND ACCESSIBILITY
    ====================================================== */

    @media (max-width: 480px) {
      .map li {
        gap: 8px;
        grid-template-columns: 40px 1fr;
        width: calc(var(--m, 100) * 1%);
        padding-left: 8px;
        padding-right: 8px;
      }

      .node {
        width: 40px;
        height: 40px;
      }

      .rt {
        gap: 6px;
      }
    }

    @media (max-width: 360px) {
      .lang button {
        padding: 0 9px;
      }

      .tg {
        width: 40px;
        height: 40px;
      }

      .w {
        padding: 0 14px;
      }

      .gb {
        min-height: 52px;
        padding: 0 20px;
        font-size: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cur .node,
      .cur .card,
      .arm,
      .pa,
      .crown .m::after,
      .map li.cur {
        animation: none;
      }

      .pa {
        opacity: 0;
      }
    }
  </style>


  <!-- =====================================================
       8. RESTORE SAVED THEME
  ====================================================== -->

  <script>
    try {
      var savedTheme = localStorage.getItem("tema");

      if (savedTheme) {
        document.documentElement.setAttribute(
          "data-theme",
          savedTheme
        );
      }
    } catch (error) {
      // The default theme remains active.
    }
  </script>
</head>

        <button

        ></button>

      </div>
    </div>
  </nav>


  <main class="w">

    <!-- Hero section -->
    <header class="hero">

      <p class="tag">
        🏙️ QUANTIQ · WALL STREET · NYC
      </p>

      <h1 id="h1"></h1>

      <p class="lead" id="ld"></p>

      <p class="demo" id="demo"></p>

      <!-- Audience selector -->
      <div
        class="aud"
        role="group"
        id="aud"
      >
        <button data-a="c" aria-pressed="true"></button>
        <button data-a="v" aria-pressed="false"></button>
      </div>

    </header>


    <!-- Interactive building -->
    <section
      class="bld"
      aria-label="QuantiQ roadmap"
    >

      <div class="crown" aria-hidden="true">
        <i class="m"></i>
        <i class="t3"></i>
        <i class="t2"></i>
        <i class="t1"></i>
      </div>

      <!-- Roadmap floors are rendered here -->
      <ol class="map" id="map"></ol>

      <div class="street" id="stt"></div>

    </section>


    <!-- Final call to action -->
    <section class="go">

      <h2 id="gh"></h2>

        href="landing.html"
        id="g1"
      ></a>

      <a
        class="btn o"
        href="mailto:hola@tuempresa.com"
        id="g2"
      ></a>

    </section>


    <!-- Footer -->
    <footer id="ft"></footer>

  </main>

          "Visión de escala: integraciones, alianzas y expansión regional."

        en: [

          "Your history, alerts and ongoing guidance, connected to your accounting tools.",
          "Scale vision: integrations, partnerships and regional expansion."

      }

    ];


    /* -----------------------------------------------------
       10.3. PAGE STATE
    ------------------------------------------------------ */

    var L = "es";
    var A = "c";

    var open = {
      2: 1
    };

    var $ = function (id) {
      return document.getElementById(id);
    };


    /* Restore preferred language */
    try {

      var savedLanguage = localStorage.getItem("lang");

      if (savedLanguage) {
        L = savedLanguage;

      } else if (
        (navigator.language || "").slice(0, 2) === "en"
      ) {
        L = "en";
      }

    } catch (error) {

      // Spanish remains the default language.

    }


    /* -----------------------------------------------------
       10.4. UTILITY FUNCTIONS
    ------------------------------------------------------ */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/"/g, "&quot;");

    }


    /* -----------------------------------------------------
       10.5. ROBOT ILLUSTRATION
    ------------------------------------------------------ */

    var BOT = `

        />

        <rect

        <circle cx="28" cy="24" r="2.4" fill="#3E2119" />

        <path
          d="M29 28Q32 30.6 35 28"
          stroke="#3E2119"

        />

        <circle cx="24" cy="28" r="1.6" fill="#ECC9B2" />

        <g class="arm">

          <rect
            x="38"

          <line

          />

          <circle
            cx="57"

            r="5"
            fill="rgba(251,251,250,.6)"
            stroke="#3E2119"

          />

        </g>

        <circle class="pa" cx="58" cy="17" r="1.8" fill="#F67F1C" />
        <circle class="pa pb" cx="52" cy="19" r="1.4" fill="#ECC9B2" />

      </svg>

    `;


    /* -----------------------------------------------------
       10.6. ROADMAP RENDERING
    ------------------------------------------------------ */

    function fill() {
      return;
    }


    function paint() {

      var labels = T[L];

      document.documentElement.lang = L;


      /* Language buttons */
      $("es").setAttribute("aria-pressed", L === "es");
      $("en").setAttribute("aria-pressed", L === "en");


      /* Floor 1 button */
      $("go0").textContent = labels.g0;

      $("go0").setAttribute(
        "aria-label",
        labels.g0a
      );


      /* Hero section */
      $("h1").innerHTML = labels.h1;
      $("ld").textContent = labels.ld;
      $("demo").innerHTML = labels.demo;
      $("stt").textContent = labels.str;


      /* Call to action */
      $("gh").textContent = labels.gh;
      $("gp").textContent = labels.gp;
      $("g1").textContent = labels.g1;
      $("g2").textContent = labels.g2;
      $("ft").textContent = labels.ft;


      /* Audience selector */
      var audienceButtons = $("aud").children;

      audienceButtons[0].textContent = labels.c;
      audienceButtons[1].textContent = labels.v;

      audienceButtons[0].setAttribute("aria-pressed", A === "c");
      audienceButtons[1].setAttribute("aria-pressed", A === "v");


      /* Generate roadmap floors */
      $("map").innerHTML = D.map(function (floor, index) {

        return [floor, index];

      })
        .reverse()

        .map(function (item) {

          var floor = item[0];
          var index = item[1];

          var text = floor[L];
          var isOpen = open[index];

          var width = Math.max(
            52,
            100 - 8 * Math.max(0, index - 1)
          );

          var mobileWidth = Math.max(
            80,
            100 - 3 * Math.max(0, index - 1)
          );

          var nodeLabel = floor.k === "done"
            ? "✓"
            : index + 1;

          var currentMarker = floor.k === "cur"
            ? `<span class="here">${labels.here}</span>`
            : "";


          return `

            <li
              class="${floor.k}"
              style="--w:${width}; --m:${mobileWidth};"
            >

              <div
                class="node"
                aria-hidden="true"
              >
                ${nodeLabel}
              </div>

              <div class="card">

                ${floor.k === "done" ? BOT : ""}

                <button
                  class="hd"
                  data-i="${index}"
                  aria-expanded="${!!isOpen}"
                >

                  <span class="pl" aria-hidden="true">
                    ${isOpen ? "−" : "+"}
                  </span>

                  <span class="st">
                    ${labels[floor.k]}
                  </span>

                  ${currentMarker}

                  <span class="dn">
                    ${labels.d} · ${labels.fl} 0${index + 1}
                  </span>

                  <span class="tt">
                    ${escapeHtml(text[0])}
                  </span>

                  <span class="ds">
                    ${escapeHtml(text[1])}
                  </span>

                </button>

                <div class="dt"${isOpen ? "" : " hidden"}>

                  <div>
                    <b>${labels.lab[A]}</b>

                    ${escapeHtml(
                      A === "c"
                        ? text[2]
                        : text[3]
                    )}

                  </div>

                </div>

              </div>

            </li>

          `;

        })

        .join("");


      fill();
      updateThemeButton();

    }


    /* -----------------------------------------------------
       10.7. FLOOR 1 BUTTON FUNCTIONALITY
    ------------------------------------------------------ */

    $("go0").addEventListener("click", function () {

      open[0] = 1;

      paint();

      var firstFloorButton = document.querySelector(
        '.hd[data-i="0"]'
      );

      if (firstFloorButton) {

        var reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

        firstFloorButton.scrollIntoView({

          behavior: reduceMotion
            ? "auto"
            : "smooth",

          block: "center"

        });

        firstFloorButton.focus({
          preventScroll: true
        });

      }

    });


    /* -----------------------------------------------------
       10.8. ROADMAP INTERACTIONS
    ------------------------------------------------------ */

    $("map").addEventListener("click", function (event) {

      var floorButton = event.target.closest(".hd");

      if (!floorButton) {
        return;
      }

      var floorIndex = floorButton.dataset.i;

      open[floorIndex] = open[floorIndex]
        ? 0
        : 1;

      paint();

      var updatedButton = document.querySelector(
        `.hd[data-i="${floorIndex}"]`
      );

      if (updatedButton) {
        updatedButton.focus();
      }

    });


    /* -----------------------------------------------------
       10.9. AUDIENCE SELECTOR
    ------------------------------------------------------ */

    $("aud").addEventListener("click", function (event) {

      var button = event.target.closest("button");

      if (button) {

        A = button.dataset.a;

        paint();

      }

    });


    /* -----------------------------------------------------
       10.10. LANGUAGE MANAGEMENT
    ------------------------------------------------------ */

    function saveLanguage() {

      try {

        localStorage.setItem("lang", L);

      } catch (error) {

        // Keep the selected language for the current session.

      }

    }


    $("es").addEventListener("click", function () {

      L = "es";

      saveLanguage();
      paint();

    });


    $("en").addEventListener("click", function () {

      L = "en";

      saveLanguage();
      paint();

    });


    /* -----------------------------------------------------
       10.11. THEME MANAGEMENT
    ------------------------------------------------------ */

    function isDarkMode() {

      var theme = document.documentElement.getAttribute(
        "data-theme"
      );

      var darkPreference = window.matchMedia(
        "(prefers-color-scheme: dark)"
      );

      return theme
        ? theme === "dark"
        : darkPreference.matches;

    }


    function updateThemeButton() {

      var button = $("tg");
      var dark = isDarkMode();

      button.textContent = dark
        ? "\u2600"
        : "\u263e";

      button.setAttribute(
        "aria-label",

        L === "en"

          ? (
              dark
                ? "Switch to day mode"
                : "Switch to night mode"
            )

          : (
              dark
                ? "Cambiar a modo día"
                : "Cambiar a modo noche"
            )

      );

      button.setAttribute(
        "aria-pressed",
        dark
      );

    }


    $("tg").addEventListener("click", function () {

      var nextTheme = isDarkMode()
        ? "light"
        : "dark";

      document.documentElement.setAttribute(
        "data-theme",
        nextTheme
      );

      try {

        localStorage.setItem(
          "tema",
          nextTheme
        );

      } catch (error) {

        // Keep the selected theme for the current session.

      }

      updateThemeButton();

    });


    /* Follow system theme preference */
    var colorScheme = window.matchMedia(
      "(prefers-color-scheme: dark)"
    );

    if (colorScheme.addEventListener) {

      colorScheme.addEventListener(
        "change",
        updateThemeButton
      );

    }


    /* -----------------------------------------------------
       10.12. RESPONSIVE EVENT LISTENERS
    ------------------------------------------------------ */

    window.addEventListener("resize", fill);


    /* -----------------------------------------------------
       10.13. INITIAL PAGE RENDER
    ------------------------------------------------------ */

    paint();

    window.setTimeout(fill, 300);

  </script>
